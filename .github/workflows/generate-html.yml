name: Generate HTML

on:
  push:
    branches: [main]
    paths:
      - README.md
      - images/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-html-main
  cancel-in-progress: false

jobs:
  generate_html_and_pdf:
    name: Generate HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get Repository Name
        id: repo_name
        run: echo "name=$(basename $GITHUB_REPOSITORY)" >> $GITHUB_OUTPUT

      # 1. GERA O HTML COM O ESTILO GITHUB
      - name: Converts Markdown to HTML
        uses: jaywcjlove/markdown-to-html-cli@main
        with:
          source: README.md
          output: index.html
          github-corners: "https://github.com/marcossilvestrini/${{ steps.repo_name.outputs.name }}"
          favicon: data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>

      # 2. SALVA SOMENTE O HTML DO SITE NA BRANCH MAIN
      - name: Commit and push HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git checkout main
          git pull --rebase origin main
          git add index.html
          git commit -m "Add generated HTML [skip ci]" || echo "No changes to commit"
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
