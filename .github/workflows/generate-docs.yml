name: Generate GitBook Docs

permissions:
  contents: write

on:  
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/powershell/generate-readmes-gitbook.ps1
  workflow_dispatch:

concurrency:
  group: generated-docs-main
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Execute PowerShell script
        run: ./scripts/powershell/generate-readmes-gitbook.ps1
        shell: pwsh

      - name: Commit and Push changes
        shell: pwsh
        run: |
          git add docs/ SUMMARY.md .gitbook.yaml

          $changes = git diff --cached
          if (-not [string]::IsNullOrWhiteSpace($changes)) {
            git commit -m "chore(docs): auto-generate GitBook documentation"
            git pull --rebase origin main
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              git push origin main
              if ($LASTEXITCODE -eq 0) { exit 0 }
              git pull --rebase origin main
            }
            throw "Unable to push generated documentation after five attempts"
          } else {
            Write-Host "Nenhuma modificação detectada. Nada a commitar."
          }
