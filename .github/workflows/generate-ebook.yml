name: Generate Ebook Formats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - images/**
      - scripts/node/**

permissions:
  contents: write

concurrency:
  group: generated-ebook-main
  cancel-in-progress: false

jobs:
  build-ebook:
    name: Build ebook PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ebook renderer
        run: npm install --no-save --no-package-lock markdown-it markdown-it-anchor playwright@1.55.0 @mermaid-js/mermaid-cli@11.12.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure Mermaid browser
        run: |
          EXECUTABLE_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          echo "PUPPETEER_EXECUTABLE_PATH=$EXECUTABLE_PATH" >> "$GITHUB_ENV"

      - name: Build ebook HTML
        env:
          EBOOK_TITLE: Learning LPIC-3 305-300
          EBOOK_COURSE_NAME: Virtualization and Containerization
          EBOOK_AUTHOR: Marcos Silvestrini
          EBOOK_LANGUAGE: English
          EBOOK_TIMEZONE: America/Sao_Paulo
        run: node scripts/node/build-ebook.mjs

      - name: Render PDF
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { fileURLToPath, pathToFileURL } from 'node:url';
          import { chromium } from 'playwright';

          const root = process.cwd();
          const htmlPath = path.join(root, 'build', 'ebook', 'ebook.html');
          const outputPath = path.join(root, 'learning-lpic-3-305-300-ebook.pdf');
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1240, height: 1754 } });
          await page.goto(pathToFileURL(htmlPath).href, { waitUntil: 'load' });
          await page.evaluate(() => document.fonts?.ready);
          await page.pdf({
            path: outputPath,
            format: 'A4',
            printBackground: true,
            preferCSSPageSize: true,
            outline: true,
            tagged: true,
            displayHeaderFooter: false,
            margin: { top: '22mm', right: '18mm', bottom: '20mm', left: '18mm' }
          });
          await browser.close();
          const stats = await fs.stat(outputPath);
          if (stats.size < 10000) throw new Error('Generated PDF is unexpectedly small');
          console.log(`Generated ${outputPath} (${stats.size} bytes)`);
          NODE

      - name: Validate ebook content
        run: |
          test -s learning-lpic-3-305-300-ebook.pdf
          if command -v pdftotext >/dev/null 2>&1; then
            pdftotext learning-lpic-3-305-300-ebook.pdf ebook.txt
            ! grep -Eiq 'github-corners|octocat|dark-mode|Generate HTML and PDF' ebook.txt
          fi

      - name: Upload ebook artifact
        uses: actions/upload-artifact@v4
        with:
          name: learning-lpic-3-305-300-ebook-source
          path: |
            learning-lpic-3-305-300-ebook.pdf
            build/ebook/ebook.html
          if-no-files-found: error
          retention-days: 30

  convert-ebook:
    name: Convert PDF to EPUB and AZW3
    needs: build-ebook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ebook assets
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated ebook source
        uses: actions/download-artifact@v4
        with:
          name: learning-lpic-3-305-300-ebook-source

      - name: Install ebook converters
        run: |
          sudo apt-get update
          sudo apt-get install --yes calibre pandoc default-jre unzip

      - name: Download EPUBCheck
        run: |
          curl --fail --location --silent --show-error \
            --output epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck.zip -d epubcheck-dist

      - name: Convert semantic HTML to EPUB 3 with Pandoc
        run: |
          pandoc build/ebook/ebook.html \
            --from=html \
            --to=epub3 \
            --css=scripts/node/ebook-epub.css \
            --epub-cover-image=images/lpic3-305-300.jpg \
            --split-level=2 \
            --metadata=title:"Learning LPIC-3 305-300" \
            --metadata=author:"Marcos Silvestrini" \
            --metadata=lang:en \
            --metadata=description:"Professional study guide for LPIC-3 305-300 virtualization and containerization." \
            --metadata=identifier:"urn:uuid:5c9f9d8a-8e21-4b62-a9a0-305300000001" \
            --metadata=publisher:"Marcos Silvestrini" \
            --output=learning-lpic-3-305-300.epub

      - name: Convert EPUB 3 to Kindle AZW3
        run: |
          ebook-convert learning-lpic-3-305-300.epub learning-lpic-3-305-300.azw3 \
            --output-profile kindle_pw3 \
            --cover images/lpic3-305-300.jpg \
            --title "Learning LPIC-3 305-300" \
            --authors "Marcos Silvestrini" \
            --language en \
            --publisher "Marcos Silvestrini"

      - name: Validate digital book files
        run: |
          test -s learning-lpic-3-305-300.epub
          test -s learning-lpic-3-305-300.azw3
          unzip -t learning-lpic-3-305-300.epub
          java -jar epubcheck-dist/epubcheck-5.1.0/epubcheck.jar learning-lpic-3-305-300.epub
          ebook-meta learning-lpic-3-305-300.epub
          ebook-meta learning-lpic-3-305-300.azw3

      - name: Upload digital book artifacts
        uses: actions/upload-artifact@v4
        with:
          name: learning-lpic-3-305-300-digital-books
          path: |
            learning-lpic-3-305-300.epub
            learning-lpic-3-305-300.azw3
          if-no-files-found: error
          retention-days: 30

  publish-ebook:
    name: Publish ebook formats to main
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [build-ebook, convert-ebook]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download ebook artifact
        uses: actions/download-artifact@v4
        with:
          name: learning-lpic-3-305-300-ebook-source

      - name: Download digital book artifacts
        uses: actions/download-artifact@v4
        with:
          name: learning-lpic-3-305-300-digital-books

      - name: Commit ebook to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp learning-lpic-3-305-300-ebook.pdf learning-lpic-3-305-300.pdf
          git add learning-lpic-3-305-300.pdf learning-lpic-3-305-300.epub learning-lpic-3-305-300.azw3
          git commit -m "docs: publish ebook formats [skip ci]" || echo "Ebook formats are unchanged"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
